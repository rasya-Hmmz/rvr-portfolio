<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 100" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="tokopedia-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="100%" stop-color="#151515"/>
    </linearGradient>
  </defs>
  <rect width="200" height="100" rx="16" fill="url(#tokopedia-bg)"/>
  <g transform="translate(100, 50)">
    <!-- Tokopedia logo - diamond/spark shape -->
    <g fill="#41B549">
      <polygon points="0,-20 14,-14 14,0 0,20 -14,0 -14,-14"/>
      <polygon points="0,-10 6,-4 6,4 0,10 -6,4 -6,-4" fill="#0a0a0a"/>
    </g>
    <text x="0" y="28" text-anchor="middle" font-family="'Space Grotesk', Arial, sans-serif" font-weight="700" font-size="14" fill="#41B549" letter-spacing="1">TOKOPEDIA</text>
  </g>
</svg>